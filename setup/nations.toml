# =====================================================================
#  SHATTERED CONTINENT - NATION DATA
#
#  Every new nation is defined here. After editing, run:
#      python3 tools/build_nations.py
#  That regenerates tags, country files, history, leaders, names, flags
#  and starting armies. Do not hand-edit the generated files.
#
#  Fields (most are optional, defaults in brackets):
#    tag            3 letters, must not clash with vanilla (tools/check_tags.py)
#    name/def/adj   country name, "the ..." form, adjective
#    group          ss_holdout | wehrmacht | red_army | cossack | warlord |
#                   raider | commune | free_state | siberian_general  (for docs/sorting)
#    ideology       democratic | communism | fascism | neutrality
#    sub_ideology   leader ideology, e.g. nazism, marxism, liberalism, despotism, anarchism
#    popularities   { democratic, communism, fascism, neutrality }  (should add to 100)
#    stability, war_support   0.0 - 1.0
#    color          [r, g, b] map colour
#    culture        western | eastern  [western]
#    tech           basic | veteran | mountain  (+ techs the template needs are added automatically)
#    nomadic        true = roaming warband mechanic
#    supplies       starting warband supplies (nomads only) [50]
#    leader         { key, name }
#    template       { name, regiments = [...], support = [...] }
#    divisions      list of division names spawned at the capital
#    experience     starting division experience 0.0 - 1.0 [0.3]
#    equipment      infantry equipment stockpile [2000]
#    ideas          national spirits (defined in common/ideas)
#    country_flags  script flags set at start
#    flag           { pattern, colors = [[r,g,b], ...] }
#                   patterns: horizontal, vertical, diagonal, triangle, cross,
#                             band, mountain, saltire, chevron, plain
#    desc           bookmark / country-select text
#    extra          raw HoI4 script appended to the history file
# =====================================================================


