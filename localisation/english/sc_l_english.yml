l_english:
 # ===================== BOOKMARK =====================
 SC_BOOKMARK_NAME:0 "The Shattered Continent"
 SC_BOOKMARK_DESC:0 "Spring, 1946. The Normandy beachheads bogged down in the hedgerows. The Red Army stalled on the Vistula. In desperation, Washington used its new weapon on Berlin and Munich instead of Japan, and something went terribly wrong. The fires and the fallout spread in a chain reaction that left Europe in ruins.\n\nThe United States, the Japanese Empire and a slowly rising Chinese Republic now decide the fate of the world. In the ruins of Europe, warlords, free cities, Cossack hosts and the last SS fortresses fight over what is left."
 SC_OTHER_GAMEPLAY_DESC:0 "Pick any nation that survived the collapse."
 SC_ENG_GAMEPLAY_DESC:0 "Britain survived, barely. It is cut off from a dead continent, rationing is tighter than in the Blitz, and the country is splitting at the seams. Ireland is rising in the west and the red flag flies over the Clyde.\n\n§YDeal with both uprisings before they boil over.§!"

 # ===================== IDEAS =====================
 sc_no_mans_land:0 "No Man's Land"
 sc_no_mans_land_desc:0 "Empty ruins, burned farms and the scattered survivors of a dead continent."
 sc_alp_mountain_redoubt_1:0 "Mountain Redoubt"
 sc_alp_mountain_redoubt_1_desc:0 "Every pass is mined, every peak has a gun position. We do not need to win. We only need to hold."
 sc_alp_mountain_redoubt_2:0 "Mountain Redoubt: Fortified Passes"
 sc_alp_mountain_redoubt_2_desc:0 "Tunnels connect the bunkers in the passes. An attacker will pay for every metre."
 sc_alp_mountain_redoubt_3:0 "Mountain Redoubt: Impregnable"
 sc_alp_mountain_redoubt_3_desc:0 "The Alps have become a single fortress, stocked for a siege of years."
 sc_fno_northern_offensive:0 "Northern Offensive Doctrine"
 sc_fno_northern_offensive_desc:0 "The garrison is too large for Norway to feed. It must expand or starve: Sweden, Denmark, Finland. The north is ours to take."
 sc_bnt_fanatical_order:0 "Fanatical Order"
 sc_bnt_fanatical_order_desc:0 "The Ordensstaat lives for the crusade. Its men fight without fear, but without an enemy to fight, they turn on each other.\n\n§RLoses stability every month while at peace.§!"
 sc_blo_cult_of_the_order:0 "Cult of the Black Order"
 sc_blo_cult_of_the_order_desc:0 "Rites, oaths and visions bind the Order to its Reichsfuehrer. Devotion must be fed or it will fade."
 sc_ash_children_of_the_fire:0 "Children of the Fire"
 sc_ash_children_of_the_fire_desc:0 "They were born or reborn in the fallout zone. Radiation frightens them far less than it frightens anyone else, but it is killing them all the same."
 sc_eng_red_clydeside:0 "Red Clydeside"
 sc_eng_red_clydeside_desc:0 "The shipyard workers of Glasgow have formed soviets. Strikes are spreading to Wales and the North."
 sc_eng_irish_troubles:0 "The Irish Rising"
 sc_eng_irish_troubles_desc:0 "With Britain on its knees, Irish republicans have taken up arms in the North."

 # ===================== WARBAND =====================
 sc_warband_category:0 "The Warband"
 sc_warband_category_desc:0 "Your army lives off the land. Supplies: §Y[?warband_supplies]§!/100. Forage left at camp: §Y[?sc_camp_forage]§!.\n\nEvery month the warband eats from the camp's forage. When it runs out, supplies fall and the men begin to starve and desert. March on before that happens, but beware the dangers of No Man's Land."
 sc_warband_march:0 "March to [FROM.GetName] (Danger §Y[?FROM.sc_danger]§!)"
 sc_warband_march_desc:0 "Break camp and move the whole warband to [FROM.GetName]. Territory we leave behind goes back to the wasteland. Costs §Y10§! supplies. The more dangerous the land, the more likely an ambush."
 sc_warband_raid:0 "Raid [FROM.GetName]"
 sc_warband_raid_desc:0 "Send riders to strip [FROM.GetName] of food and anything else worth carrying. Gives §G+20§! supplies, but the land will not feed anyone for a long time afterwards."
 sc_warband_settle_down:0 "Put Down Roots"
 sc_warband_settle_down_desc:0 "The men are tired of the road. This land is rich enough to farm. Lay down the banners and build something that lasts.\n\n§RThis ends the roaming warlord gameplay.§!"
 sc_warband_starving:0 "Starving Warband"
 sc_warband_well_fed:0 "Well-Fed Warband"

 # ===================== THE WASTES =====================
 sc_wastes_category:0 "The Wastes"
 sc_wastes_category_desc:0 "No Man's Land is not empty. Raiders, deserters, wild dogs, minefields and the dead cities themselves make it deadly. Danger rises every month in land nobody holds.\n\nSweep dangerous land to make it safer, then claim it once its danger is below §Y25§!. §RIrradiated§! zones cannot be swept or claimed."
 sc_wastes_sweep:0 "Sweep [FROM.GetName] (Danger §Y[?FROM.sc_danger]§!)"
 sc_wastes_sweep_desc:0 "Send patrols to clear raiders and mines from [FROM.GetName]. Costs §R500§! manpower, lowers danger by §G30§!."
 sc_wastes_claim:0 "Settle [FROM.GetName]"
 sc_wastes_claim_desc:0 "[FROM.GetName] is safe enough for settlers. After 45 days, it becomes ours."
 sc_radiation_sickness:0 "Radiation Sickness"
 sc_radiation_sickness_mild:0 "Radiation Sickness (Resistant)"

 # ===================== FACTIONS =====================
 sc_alp_category:0 "The Redoubt"
 sc_alp_category_desc:0 "The Alpenfestung does not need to conquer. It needs to be impossible to conquer."
 sc_alp_fortify_passes_1:0 "Fortify the Passes"
 sc_alp_fortify_passes_1_desc:0 "Dig tunnels and pour concrete in the Brenner and Arlberg passes."
 sc_alp_fortify_passes_2:0 "Make the Mountains a Fortress"
 sc_alp_fortify_passes_2_desc:0 "Link every bunker, stock every cave. Let them come."
 sc_alp_call_the_faithful:0 "Call the Faithful to the Mountains"
 sc_alp_call_the_faithful_desc:0 "Survivors and stragglers still find their way up the valleys. Arm them."

 sc_fno_category:0 "Festung Nord Expansion"
 sc_fno_category_desc:0 "Norway cannot feed four hundred thousand men. The garrison must expand."
 sc_fno_plan_invasion:0 "Plan the Invasion of [FROM.GetName]"
 sc_fno_plan_invasion_desc:0 "Draw up invasion plans and manufacture a pretext. Gives a war goal against [FROM.GetName]."
 sc_fno_colonize:0 "Colonise [FROM.GetName] (Danger §Y[?FROM.sc_danger]§!)"
 sc_fno_colonize_desc:0 "Our soldiers are not afraid of the wasteland. Garrisons can hold land that settlers would flee from (danger below §Y50§!)."

 sc_bnt_category:0 "The Crusade"
 sc_bnt_category_desc:0 "The Ordensstaat must always have an enemy."
 sc_bnt_holy_war:0 "Declare Crusade on [FROM.GetName]"
 sc_bnt_holy_war_desc:0 "The Order needs no pretext. Gives a war goal against [FROM.GetName]."
 sc_bnt_blood_levy:0 "The Blood Levy"
 sc_bnt_blood_levy_desc:0 "Every man who can carry a rifle is called to the colours, whether he wants to go or not."

 sc_blo_category:0 "The Black Order"
 sc_blo_category_desc:0 "Devotion: §Y[?sc_devotion]§!/100\n\nThe Order's grip on its people depends on devotion. It fades every month. High devotion brings stability and war support. Low devotion brings heresy."
 sc_blo_rites:0 "Rites at the Ordensburg"
 sc_blo_rites_desc:0 "Torchlit ceremonies in the old cathedral of Saint Michael. Gives §G+15§! devotion."
 sc_blo_visions:0 "Consult the Reichsfuehrer's Visions"
 sc_blo_visions_desc:0 "The Reichsfuehrer has dreamed again. His prophecies may inspire the faithful, or embarrass the Order."
 sc_blo_knighthood:0 "Induct New Knights"
 sc_blo_knighthood_desc:0 "Promote the most devoted soldiers into the inner Order. Gives §G+10§! devotion and army experience."
 sc_blo_devotion:0 "Devotion to the Order"

 sc_eng_unrest_category:0 "A Kingdom Divided"
 sc_eng_unrest_category_desc:0 "Two uprisings threaten to tear Britain apart. Deal with each one before its timer runs out."
 sc_eng_clydeside_mission:0 "The Red Clydeside"
 sc_eng_clydeside_mission_desc:0 "If the Glasgow soviets are not dealt with, §Rsocialist revolution will break out across Britain§!."
 sc_eng_ireland_mission:0 "The Irish Rising"
 sc_eng_ireland_mission_desc:0 "If the rising is not dealt with, §RUlster will be lost to Ireland§!."
 sc_eng_clydeside_crackdown:0 "Send the Army to Glasgow"
 sc_eng_clydeside_crackdown_desc:0 "Tanks on George Square. It worked in 1919."
 sc_eng_clydeside_concessions:0 "Negotiate with the Shop Stewards"
 sc_eng_clydeside_concessions_desc:0 "Give the workers what they want: rations, wages, a voice. The socialists will grow stronger, but peacefully."
 sc_eng_ireland_crackdown:0 "Reinforce Ulster"
 sc_eng_ireland_crackdown_desc:0 "Pour troops into the North and hold it by force."
 sc_eng_ireland_home_rule:0 "Let Ulster Go"
 sc_eng_ireland_home_rule_desc:0 "We cannot hold the North and feed Britain at the same time. Hand it to Dublin peacefully."

 # ===================== EVENTS =====================
 sc_warband.1.t:0 "The Men Are Deserting"
 sc_warband.1.d:0 "The wagons are empty. Last night whole squads slipped away into the dark to find food on their own. If we do not find new land soon, there will be no warband left to lead."
 sc_warband.1.a:0 "Find them. Then find food."
 sc_warband.2.t:0 "A New Camp"
 sc_warband.2.d:0 "The columns reach [Root.Capital.GetName] and the tents go up. Scouts ride out to count the fields and granaries still standing."
 sc_warband.2.a:0 "We eat tonight."
 sc_warband.3.t:0 "Too Late"
 sc_warband.3.d:0 "Our outriders came back with bad news. Someone else has already claimed the land we were marching to. The march was wasted."
 sc_warband.3.a:0 "Curse them."

 sc_danger.1.t:0 "Raiders from the Wastes"
 sc_danger.1.d:0 "A band of raiders crossed the border from No Man's Land last night. They burned a village and drove off its cattle, and our border garrison is demanding orders."
 sc_danger.1.a:0 "Hunt them down."
 sc_danger.1.b:0 "Pay them to go away."
 sc_danger.2.t:0 "Ambush!"
 sc_danger.2.d:0 "The column was strung out along a sunken road when the shooting started. Mines, then machine guns from the ruins. By the time we broke through, the wagons were burning."
 sc_danger.2.a:0 "Bury the dead and move on."
 sc_danger.3.t:0 "A Cache in the Ruins"
 sc_danger.3.d:0 "Scouts found a sealed depot under a collapsed railway station: crates of rifles, ammunition and tinned food, untouched since 1945."
 sc_danger.3.a:0 "Load the wagons."

 sc_cult.1.t:0 "The Reichsfuehrer Has Dreamed"
 sc_cult.1.d:0 "At dawn the Reichsfuehrer summoned his knights to the great hall. In the night, he says, the ancestors spoke to him. He has written their words down on eleven pages, and the Order must obey."
 sc_cult.1.a:0 "So it is written."
 sc_cult.2.t:0 "Heresy in the Ranks"
 sc_cult.2.d:0 "Pamphlets have been found in the barracks of the Ordensgarde mocking the Reichsfuehrer's visions. Devotion is fading, and some of the knights are asking questions."
 sc_cult.2.a:0 "Purge the doubters."
 sc_cult.2.b:0 "Look the other way."
